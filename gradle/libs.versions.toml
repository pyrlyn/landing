[versions]
kotlin = "2.4.21"
kotlinx-html = "0.12.0"
kotlinx-serialization = "1.9.0"
ktor = "3.6.0"
kotlin-wrappers = "2026.10.5"
jetbrains-markdown = "0.7.18"

[libraries]
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinx-html" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css-jvm", version.ref = "kotlin-wrappers" }
jetbrains-markdown = { module = "org.jetbrains:markdown-jvm", version.ref = "jetbrains-markdown" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
