[tools]
"github:jdx/jactionlint" = "2.0.2" # the CI `jactionlint` job, the pre-push hook and local `mise x -- jactionlint`
hk = "2.5.0" # runs jactionlint as a pre-push hook (hk.pkl); `mise x -- hk install --mise`
shellcheck = "0.11.0" # used by jactionlint for run: scripts
node = "24.22.0" # Active LTS; runtime for the npm: tools below
"npm:agent-device" = "0.21.31" # lets agents open and check the landing site as a real client
