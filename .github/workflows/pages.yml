name: Deploy to GitHub Pages

# Astro build + docs and SEO checks, deployed to GitHub Pages through pyrlyn/ci's pages.yml.
on:
  push:
    branches: [main]
  # Pull requests run the build and the checks only; deploy stays main-only.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: pyrlyn/ci/.github/workflows/pages.yml@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false
      node-version: "22"
      node-cache-dependency-path: package-lock.json
      setup-command: npm ci
      build-command: |
        export SITE_URL=https://pyrlyn.github.io SITE_BASE=/landing/
        npm run build
        # Astro and TypeScript diagnostics
        npm run check
        # docs coverage, headings and internal links
        npm run check:docs
        # SEO meta, headings, alt text, JSON-LD and sitemap
        npm run check:seo
      artifact-path: dist
