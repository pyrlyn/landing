name: 'lighthouse-nightly'
on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: 'read'
concurrency:
  group: 'lighthouse-nightly'
  cancel-in-progress: false
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/lighthouse-nightly.yaml'' && ''.github/workflows/lighthouse-nightly.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/lighthouse-nightly.yaml'''
  lighthouse:
    name: 'Lighthouse CI'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    timeout-minutes: 25
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        persist-credentials: 'false'
    - id: 'step-1'
      name: 'Set up JDK'
      uses: 'actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad'
      with:
        java-version: '21'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Set up Gradle'
      uses: 'gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6'
      with:
        build-root-directory: 'landings/pyrlyn'
    - id: 'step-3'
      name: 'Set up Node'
      uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1'
      with:
        node-version: '22'
    - id: 'step-4'
      name: 'Build site'
      env:
        SITE_URL: 'https://pyrlyn.dev'
        SITE_BASE: '/'
        GITHUB_TOKEN: '${{ secrets.BACKEND_PACKAGES_TOKEN }}'
      working-directory: 'landings/pyrlyn'
      run: './gradlew generateSite'
    - id: 'step-5'
      name: 'Lighthouse (mobile)'
      working-directory: 'landings/pyrlyn'
      run: 'npx --yes --ignore-scripts @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json'
    - id: 'step-6'
      name: 'Lighthouse (desktop)'
      working-directory: 'landings/pyrlyn'
      run: 'npx --yes --ignore-scripts @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json'
      if: '${{ !cancelled() }}'
    - id: 'step-7'
      name: 'Upload Lighthouse reports'
      uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
      with:
        name: 'lighthouse-reports'
        path: 'landings/pyrlyn/.lighthouseci/'
        if-no-files-found: 'warn'
        retention-days: '14'
        include-hidden-files: 'true'
      if: '${{ !cancelled() }}'
