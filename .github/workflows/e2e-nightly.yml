name: e2e-nightly

# Playwright e2e tests (./gradlew e2eTest) once a night; not run on PRs or pushes.
on:
  schedule:
    # 03:00 UTC = 05:00 Kyiv in winter (UTC+2). GitHub cron is UTC-only, so in summer (UTC+3) this runs at 06:00 Kyiv.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push: { branches: [ci/e2e-nightly] } # TEMP: verification run only, removed before merge

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Playwright Chromium (with OS deps)
        run: ./gradlew :e2e:playwrightInstall -PwithDeps
      - name: Run e2e tests
        run: ./gradlew e2eTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            e2e/build/reports/
            e2e/build/test-results/
            e2e/build/traces/
          if-no-files-found: ignore
          retention-days: 14
