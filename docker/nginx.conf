# Static Astro build (one HTML file per page). Used by the Dockerfile as conf.d/default.conf.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects relative, so /rtok -> /rtok/ works behind any host port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Hashed assets emitted by Astro never change under the same name.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
