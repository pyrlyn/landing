# Static Kotlin/JS landing build (pyrlyn/landing-kotlin build/site, one HTML file per page). Used by the Dockerfile as conf.d/default.conf.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects relative, so /rtok -> /rtok/ works behind any host port.
    absolute_redirect off;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html { internal; }
    # Served directly too (200), so the 5xx page can be checked and the proxy can fetch it.

    # Hashed assets (name.<hash>.js) never change under the same name.
    location /_assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
