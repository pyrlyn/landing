# This file was generated using Kotlin DSL (.github/workflows/lighthouse.main.kts).
# If you want to modify the workflow, please change the Kotlin file and regenerate this YAML file.
# Generated with https://github.com/typesafegithub/github-workflows-kt

name: 'lighthouse'
on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'
  workflow_dispatch: {}
permissions:
  contents: 'read'
concurrency:
  group: 'lighthouse-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/lighthouse.yaml'' && ''.github/workflows/lighthouse.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/lighthouse.yaml'''
  test:
    name: 'Tests and site checks'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    timeout-minutes: 15
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        persist-credentials: 'false'
    - id: 'step-1'
      name: 'Set up Node'
      uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1'
      with:
        node-version: '22'
        cache: 'npm'
    - id: 'step-2'
      name: 'Install dependencies'
      run: |-
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        npm ci --no-audit --no-fund --ignore-scripts
    - id: 'step-3'
      name: 'Unit tests'
      run: 'npm test'
    - id: 'step-4'
      name: 'Build'
      env:
        SITE_URL: 'https://pyrlyn.dev'
      run: 'npm run build'
      if: '${{ !cancelled() }}'
    - id: 'step-5'
      name: 'check:seo'
      env:
        SITE_URL: 'https://pyrlyn.dev'
      run: 'npm run check:seo'
      if: '${{ !cancelled() }}'
    - id: 'step-6'
      name: 'check:docs'
      run: 'npm run check:docs'
      if: '${{ !cancelled() }}'
  lighthouse:
    name: 'Lighthouse CI'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    if: '${{ vars.LIGHTHOUSE_ENABLED == ''true'' }}'
    timeout-minutes: 20
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
      with:
        persist-credentials: 'false'
    - id: 'step-1'
      name: 'Set up Node'
      uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1'
      with:
        node-version: '22'
        cache: 'npm'
    - id: 'step-2'
      name: 'Install dependencies'
      run: |-
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        npm ci --no-audit --no-fund --ignore-scripts
    - id: 'step-3'
      name: 'Build'
      env:
        SITE_URL: 'https://pyrlyn.dev'
        SITE_BASE: '/'
      run: 'npm run build'
    - id: 'step-4'
      name: 'Lighthouse (mobile)'
      run: 'npx --yes --ignore-scripts @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json'
    - id: 'step-5'
      name: 'Lighthouse (desktop)'
      run: 'npx --yes --ignore-scripts @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json'
      if: '${{ !cancelled() }}'
    - id: 'step-6'
      name: 'Upload Lighthouse reports'
      uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
      with:
        name: 'lighthouse-reports'
        path: '.lighthouseci/'
        if-no-files-found: 'warn'
        retention-days: '14'
        include-hidden-files: 'true'
      if: '${{ !cancelled() }}'
